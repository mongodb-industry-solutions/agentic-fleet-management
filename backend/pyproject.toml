[project]
name = "agentic-fleet-management"
version = "0.1.0"
description = "Fleet telemetry unification, validation and fusion on MongoDB Atlas"
requires-python = ">=3.13,<3.14"
dependencies = [
    "pymongo>=4.10.1",
    "python-dotenv>=1.0.1",
    "fastapi>=0.115.4",
    "uvicorn>=0.32.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0.2",
    "boto3>=1.35.70",
    "botocore>=1.35.70",
    "voyageai>=0.3.2",
    "python-multipart>=0.0.20",
    "langgraph>=1.2.11",
    "langgraph-checkpoint-mongodb>=0.5.0",
    "langchain-aws>=1.7.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
