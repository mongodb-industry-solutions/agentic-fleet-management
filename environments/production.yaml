# Kanopy security and ownership (requires web-app chart v4.30.0+)
security:
  dataClassification: "Internal"
  dataDesignation: ["MI"]

ownership:
  driEmail: owner.email@mongodb.com

env:
  NODE_ENV: prod
  # AWS region for IRSA (no credentials needed)
  AWS_REGION: us-east-1
  # Backend API URL for frontend to connect to backend health check
  BACKEND_URL: http://localhost:8000 # or http://localhost:8000 if multicontainer pod is setup and backend is running on 8000

## Single Pod Containers
envSecrets:
  MONGODB_URI: fleet-management-staging
  DATABASE_NAME: fleet-management-staging
  APP_NAME: fleet-management-staging
  VOYAGE_API_KEY: fleet-management-staging
  PROFILE: fleet-management-staging
  AWS_PROFILE: fleet-management-staging
  ORIGINS: fleet-management-staging

## ----------------------------- Cloud Specific Configurations (For AWS only line 42 to 46 needed)-----------------------------

## Add IRSA configuration here, this is for AWS
serviceAccount:
  enabled: true
  irsa:
    accountId: "275662791714"
    roleName: "kanopy-prod-cicd-irsa"
